[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "upadya-component-b-generator"
version = "0.1.0+be0.0e86fdc"
description = "Pinned internal Component B generator package for the Upadya backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema==4.25.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["component_b_generator*", "models*", "validators*"]
namespaces = false

